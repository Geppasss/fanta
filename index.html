<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Fanta Consigli</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: app da telefono con fascia in alto, schede e barra di navigazione in basso; il campo è una lavagna tattica con maglie disegnate. */
:root {
  --bg: #edf0ed; --surface: #ffffff; --fg: #131c18; --muted: #566860; --line: #d3dbd5;
  --accent: #8f5a10; --accent-fg: #ffffff; --accent-soft: #f3e6cf;
  --warn: #8a5200; --warn-bg: #fbefd5; --bad: #a32a22; --bad-bg: #f9dedb; --ok: #1d6b44; --ok-bg: #dcefe3;
  --hero: #14372b; --hero-2: #19402f; --hero-fg: #f1f6f2; --hero-warn: #f0c36a; --hero-bad: #ff9d90;
  --pitch: #1f6b45; --pitch-2: #247a4f; --chalk: rgba(255,255,255,.55); --label-bg: rgba(8,20,15,.8);
  --nav: #ffffff;
  --r-p: #9a6a14; --r-d: #2b63a0; --r-c: #1f7a4d; --r-a: #b3412e; --ink: #ffffff;
  --font-display: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
  --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1511; --surface: #17211b; --fg: #e8efe9; --muted: #9db0a3; --line: #2a382f;
    --accent: #e2b45c; --accent-fg: #1a1405; --accent-soft: #3a2f16;
    --warn: #f0b659; --warn-bg: #3a2c10; --bad: #f08a80; --bad-bg: #3d1b18; --ok: #6fd09b; --ok-bg: #153021;
    --hero: #0b241b; --hero-2: #0f2c21; --nav: #121b16;
    --pitch: #16553a; --pitch-2: #1a6141;
    --r-p: #e0ad4e; --r-d: #5b9bd5; --r-c: #58b883; --r-a: #e0715c; --ink: #0e1511;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1511; --surface: #17211b; --fg: #e8efe9; --muted: #9db0a3; --line: #2a382f;
  --accent: #e2b45c; --accent-fg: #1a1405; --accent-soft: #3a2f16;
  --warn: #f0b659; --warn-bg: #3a2c10; --bad: #f08a80; --bad-bg: #3d1b18; --ok: #6fd09b; --ok-bg: #153021;
  --hero: #0b241b; --hero-2: #0f2c21; --nav: #121b16;
  --pitch: #16553a; --pitch-2: #1a6141;
  --r-p: #e0ad4e; --r-d: #5b9bd5; --r-c: #58b883; --r-a: #e0715c; --ink: #0e1511;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.in { max-width: 720px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; line-height: 1.05; text-wrap: balance; }
p { margin: 8px 0 0; }
.muted { color: var(--muted); }

/* fascia in alto */
.hero {
  background: repeating-linear-gradient(90deg, var(--hero) 0 48px, var(--hero-2) 48px 96px);
  color: var(--hero-fg);
  margin-top: calc(-1 * env(safe-area-inset-top, 0px));
  padding-top: calc(env(safe-area-inset-top, 0px) + 22px);
  padding-bottom: 20px;
}
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; opacity: .78; }
.hero h1 { font-size: clamp(46px, 13vw, 68px); font-weight: 700; text-transform: uppercase; letter-spacing: .01em; margin-top: 6px; }
.hero .sub { opacity: .85; margin-top: 6px; }
.hstats { display: flex; gap: 26px; margin-top: 16px; }
.hstats b { display: block; font: 700 36px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.hstats span { font-size: 12px; opacity: .8; }
.hstats .w b { color: var(--hero-warn); }
.hstats .x b { color: var(--hero-bad); }

main { padding-top: 6px; padding-bottom: calc(104px + env(safe-area-inset-bottom, 0px)); }
section > h2 { font-size: 30px; font-weight: 700; text-transform: uppercase; letter-spacing: .01em; margin-top: 20px; }
.lead { color: var(--muted); margin-top: 6px; }

/* schede */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; margin-top: 14px; }
.card h3 { font-size: 21px; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; }
.card h4 { margin: 14px 0 0; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.btn { font: inherit; font-weight: 600; font-size: 14px; background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 6px; padding: 9px 14px; cursor: pointer; margin-top: 12px; }
.btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
.seg { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 6px; margin-top: 10px; }
.seg button {
  font: inherit; font-weight: 600; font-size: 14px; color: var(--fg); background: var(--surface);
  border: 1px solid var(--line); border-radius: 99px; padding: 7px 14px; cursor: pointer; white-space: nowrap;
}
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* maglie e righe */
.shirt { display: block; }
.sh { position: relative; display: inline-block; line-height: 0; }
.dot { position: absolute; right: -3px; top: -3px; width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--surface); }
.dot.dubbio, .dot.discordi { background: var(--warn); }
.dot.out { background: var(--bad); }
.cd { display: block; height: auto; }
.rl { position: absolute; left: 50%; bottom: 5%; transform: translateX(-50%); width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font: 700 13px var(--font-display); color: var(--ink); }
.rows { margin-top: 8px; }
.rowi { display: grid; grid-template-columns: auto 1fr auto; gap: 0 12px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
.rows .rowi:first-child { border-top: 0; }
.rowi .nm { font-weight: 600; line-height: 1.25; }
.rowi .meta { color: var(--muted); font-size: 13px; }
.rowi .cost { font: 600 18px var(--font-display); font-variant-numeric: tabular-nums; text-align: right; }
.rowi .note { grid-column: 2 / 4; color: var(--muted); font-size: 13px; margin-top: 2px; }
.badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; white-space: nowrap; margin-left: 6px; }
.badge.out { background: var(--bad-bg); color: var(--bad); }
.badge.dubbio, .badge.discordi { background: var(--warn-bg); color: var(--warn); }

/* campo */
.pitch {
  position: relative; margin-top: 12px; padding: 22px 6px 18px; border-radius: 10px; display: grid; gap: 26px;
  background: repeating-linear-gradient(0deg, var(--pitch) 0 50px, var(--pitch-2) 50px 100px);
}
.pitch svg.lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.prow { position: relative; display: flex; justify-content: center; gap: 4px; }
.pl { display: flex; flex-direction: column; align-items: center; flex: 1 1 0; max-width: 84px; min-width: 0; }
.pl .nm { margin-top: 3px; background: var(--label-bg); color: #fff; border-radius: 4px; padding: 1px 4px; font-size: 11.5px; font-weight: 600; max-width: 100%; text-align: center; line-height: 1.2; overflow-wrap: break-word; }
.pl .pc { font-size: 11px; color: #fff; opacity: .85; font-variant-numeric: tabular-nums; }
.warnbox { margin-top: 12px; padding: 10px 12px; border-radius: 6px; background: var(--warn-bg); color: var(--warn); font-size: 14px; }
.okbox { margin-top: 12px; padding: 10px 12px; border-radius: 6px; background: var(--ok-bg); color: var(--ok); font-size: 14px; }

.pair { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; margin-top: 12px; }
.pair .lab { display: block; text-align: center; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
.pair > svg { width: 22px; height: 22px; fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; margin-top: 18px; }
.why { color: var(--muted); font-size: 13px; margin-top: 8px; }
.need { padding: 8px 0; border-top: 1px solid var(--line); }
.need:first-of-type { border-top: 0; }
/* tile, barre, tabelle */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; margin-top: 8px; }
.tile { border: 1px solid var(--line); border-radius: 8px; padding: 10px 6px 8px; text-align: center; background: var(--surface); min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.tile .nm { font-weight: 600; font-size: 14px; line-height: 1.2; overflow-wrap: anywhere; }
.tile .meta { color: var(--muted); font-size: 12px; }
.tile .cost { font: 600 17px var(--font-display); font-variant-numeric: tabular-nums; }
.bar { display: flex; height: 14px; border-radius: 7px; overflow: hidden; margin-top: 10px; background: var(--line); }
.bar span { display: block; min-width: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; }
.stat { display: flex; gap: 8px; justify-content: space-between; margin-top: 8px; font-size: 14px; flex-wrap: wrap; }
.stat b { font-variant-numeric: tabular-nums; }
.rk { padding: 7px 0; border-top: 1px solid var(--line); }
.rk:first-child { border-top: 0; }
.rk .top { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.rk .top b { font-variant-numeric: tabular-nums; }
.meter { height: 6px; border-radius: 3px; background: var(--line); margin-top: 5px; overflow: hidden; }
.meter span { display: block; height: 100%; background: var(--accent); }
.tablewrap { overflow-x: auto; margin-top: 8px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
td, th { text-align: left; padding: 7px 12px 7px 0; border-top: 1px solid var(--line); font-size: 14px; white-space: nowrap; }
th { font-size: 12px; color: var(--muted); font-weight: 600; border-top: 0; letter-spacing: .06em; text-transform: uppercase; }
.swap { display: flex; align-items: center; gap: 8px; margin-top: 12px; color: var(--accent); font-weight: 600; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; }
.swap::before, .swap::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.foot { margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
.foot a { color: var(--accent); }

/* barra in basso */
.bottom { position: fixed; left: 0; right: 0; bottom: 0; background: var(--nav); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 20; }
.bottom .in { display: grid; grid-template-columns: repeat(7, 1fr); }
.bottom button { font: inherit; background: none; border: 0; color: var(--muted); padding: 8px 0 7px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; font-weight: 600; cursor: pointer; min-width: 0; }
.bottom button[aria-current="page"] { color: var(--accent); }
.bottom svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }


.fld { display: grid; gap: 6px; margin-top: 12px; }
.fld label { font-size: 14px; }
input[type=text], input[type=password], input[type=email], select, textarea {
  font: inherit; font-size: 15px; color: var(--fg); background: var(--bg); border: 1px solid var(--line);
  border-radius: 6px; padding: 9px 10px; width: 100%; min-width: 0;
}
textarea { min-height: 110px; resize: vertical; }
.pre { white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px; margin: 8px 0 0; max-height: 360px; overflow: auto; }
details summary { cursor: pointer; font-weight: 600; margin-top: 10px; }
details ul { margin: 6px 0 0; padding-left: 18px; font-size: 13px; color: var(--muted); }
.st { display: flex; justify-content: space-between; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; flex-wrap: wrap; }
.st:first-of-type { border-top: 0; }
.err { color: var(--bad); font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: default; }
.btn.danger { background: var(--bad); color: #fff; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
label.btn { display: inline-block; }
.logbox { font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 8px; }
.by { font-size: 13px; margin-top: 8px; }
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }
.cd { object-fit: cover; border-radius: 8px; }
.chk { display: flex; gap: 8px; align-items: flex-start; margin-top: 12px; font-size: 14px; }
.chk input { margin-top: 3px; }
.link { background: none; border: 0; color: var(--accent); font: inherit; text-decoration: underline; padding: 8px 0; cursor: pointer; }
.steps { display: flex; gap: 6px; margin-top: 14px; }
.steps span { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
.steps span.on { background: var(--accent); }
#screen { padding-top: 6px; padding-bottom: 40px; }
body[data-mode="screen"] main, body[data-mode="screen"] nav.bottom { display: none; }
body[data-mode="app"] #screen { display: none; }
form .btn { margin-top: 14px; }
[hidden] { display: none !important; }
</style>
</head>
<body data-mode="screen">

<script>
/* ===== configurazione Firebase (pubblica per natura: i dati li protegge Firestore con le regole) ===== */
const FIREBASE_CONFIG = {

};

/* ===== costanti e stato ===== */
const ROLES = { P: "Portieri", D: "Difensori", C: "Centrocampisti", A: "Attaccanti" };
const ROLE_ONE = { P: "Portiere", D: "Difensore", C: "Centrocampista", A: "Attaccante" };
const LABEL = { out: "Assente", dubbio: "In dubbio", discordi: "Fonti discordi" };
const LABEL_LOW = { out: "assente", dubbio: "in dubbio", discordi: "incerto, fonti discordi" };
const MODULES = ["3-4-3", "3-5-2", "4-3-3", "4-4-2", "4-5-1", "5-3-2"];
const FREE_KEY = "Svincolati";
let DATA = {}, FREE = [], ME = "", LEAGUE = "", TEAMS = [];
let CAL = [], GIORNATA = null, STATUSN = {}, IMGS = {};
let USER = null, PROFILE = null, db = null, auth = null;

  mod: "3-4-3", tradeRole: "D", fsrc: "maj", log: [], busy: false, manText: "", manKind: "chatgpt",
  legaView: "inf", infTeam: "Tutte", infKind: "tutti", roseTeam: "", roseRole: "T", msg: ""
};

const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ESC[c]);
const clean = (s) => String(s == null ? "" : s).replace(/[<>&"`\\]/g, "").replace(/\s+/g, " ").trim().slice(0, 48);
function norm(s) { return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]/g, ""); }
const fmt = (ts) => new Date(ts).toLocaleString("it-IT", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
const todayIt = () => new Date().toLocaleDateString("it-IT", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
const sum = (arr) => arr.reduce((a, p) => a + (p.c || 0), 0);

/* archivio locale, separato per account: chiavi, ricerche e risultati restano su questo dispositivo */
const NS = () => "fanta." + (USER ? USER.uid : "anon") + ".";
function lsGet(k, d) { try { const v = localStorage.getItem(NS() + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(NS() + k, JSON.stringify(v)); } catch (e) { /* archivio non disponibile */ } }
function lsDelAll() {
  try {
    const p = NS(); const del = [];
    for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.indexOf(p) === 0) { del.push(k); } }
    del.forEach((k) => localStorage.removeItem(k));
  } catch (e) { /* niente */ }
}
const store = { keys: {}, models: {}, dossier: null, results: {}, status: {}, cal: null };
function loadLocal() {
  store.keys = lsGet("keys", {}); store.models = lsGet("models", {}); store.dossier = lsGet("dossier", null);
  store.results = lsGet("results", {}); store.status = lsGet("status", {}); store.cal = lsGet("cal", null);
  applyLocalData();
}
function save() {
  lsSet("keys", store.keys); lsSet("models", store.models); lsSet("dossier", store.dossier);
  lsSet("results", store.results); lsSet("status", store.status); lsSet("cal", store.cal);
}
function applyLocalData() {
  STATUSN = store.status || {};
  CAL = store.cal && store.cal.rows ? store.cal.rows : [];
  GIORNATA = store.cal && store.cal.n ? store.cal.n : null;
}

/* immagini caricate dall'utente: restano nel browser (IndexedDB), mai sul server */
function idbOpen() {
  return new Promise((res, rej) => {
    try {
      const r = indexedDB.open("fanta-img", 1);
      r.onupgradeneeded = () => { r.result.createObjectStore("img"); };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    } catch (e) { rej(e); }
  });
}
async function idbGet(key) {
  try { const d = await idbOpen(); return await new Promise((res) => { const q = d.transaction("img").objectStore("img").get(key); q.onsuccess = () => res(q.result || {}); q.onerror = () => res({}); }); }
  catch (e) { return {}; }
}
async function idbPut(key, val) {
  try { const d = await idbOpen(); await new Promise((res) => { const t = d.transaction("img", "readwrite"); t.objectStore("img").put(val, key); t.oncomplete = () => res(); t.onerror = () => res(); }); }
  catch (e) { /* senza archivio le immagini durano fino alla chiusura della pagina */ }
}
async function loadImgs() { IMGS = USER ? await idbGet(USER.uid) : {}; }
async function saveImgs() { if (USER) { await idbPut(USER.uid, IMGS); } }

/* ===== lettura dei file .xlsx senza librerie esterne ===== */
async function inflateRaw(u8) {
  const stream = new Blob([u8]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function unzip(buf) {
  const u8 = new Uint8Array(buf); const dv = new DataView(buf); const td = new TextDecoder();
  let e = u8.length - 22;
  while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) { e--; }
  if (e < 0) { throw new Error("Il file non è un .xlsx valido"); }
  const n = dv.getUint16(e + 10, true); let p = dv.getUint32(e + 16, true);
  const files = {};
  for (let i = 0; i < n; i++) {

function ideas(role) {
  const mine = (DATA[ME] || []).filter((p) => p.r === role);
  const ordered = mine.slice().sort((a, b) => rank(ME, a.n) - rank(ME, b.n) || b.c - a.c);
  const need = needFor()[role];
  const starters = ordered.filter((p) => rank(ME, p.n) < 2).slice(0, need);
  const weakest = starters[starters.length - 1];
  const spare = mine.filter((p) => starters.indexOf(p) < 0).sort((a, b) => b.c - a.c);
  const pool = [];

  }));

      const d = Math.abs(x.p.c - sp.c);
      if (!best || d < best.d) { best = { x: x, d: d }; }
    });
    if (best && best.d <= Math.max(15, sp.c * 0.5)) { used[best.x.t + best.x.p.n] = true; pairs.push({ give: sp, get: best.x }); }
  });
  const needs = [];
  TEAMS.filter((t) => t !== ME).forEach((t) => {

function matchImgPlayer(base) {
  const fn = norm(base); if (!fn) { return null; }
  const all = []; TEAMS.forEach((t) => DATA[t].forEach((p) => all.push(p))); FREE.forEach((p) => all.push(p));
  let ex = all.filter((p) => norm(p.n) === fn);
  if (ex.length) { return ex[0]; }
  const cont = all.filter((p) => norm(p.n).length >= 4 && fn.indexOf(norm(p.n)) >= 0).sort((a, b) => norm(b.n).length - norm(a.n).length);
  if (cont.length && (cont.length === 1 || norm(cont[0].n).length > norm(cont[1].n).length)) { return cont[0]; }
  if (fn.length >= 5) { const pre = all.filter((p) => norm(p.n).indexOf(fn) === 0); if (pre.length === 1) { return pre[0]; } }
  return null;
}
function resizeImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const im = new Image();
    im.onload = () => {
      const k = Math.min(1, 160 / Math.max(im.width, im.height));
      const w = Math.max(1, Math.round(im.width * k)), h = Math.max(1, Math.round(im.height * k));
      const c = document.createElement("canvas"); c.width = w; c.height = h; c.getContext("2d").drawImage(im, 0, 0, w, h);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", 0.82));
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error("immagine non leggibile")); };
    im.src = url;
  });
}
async function addImages(files) {
  let ok = 0; const bad = [];
  for (let i = 0; i < files.length; i++) {
    const f = files[i]; const base = f.name.replace(/\.[^.]+$/, "");
    const p = matchImgPlayer(base);
    if (!p) { bad.push(f.name); continue; }
    try { IMGS[norm(p.n)] = await resizeImage(f); ok++; } catch (e) { bad.push(f.name); }
  }
  await saveImgs();
  state.msg = ok + " immagini associate." + (bad.length ? " Non riconosciute: " + bad.slice(0, 6).join(", ") + (bad.length > 6 ? "..." : "") + "." : "");
  renderAll();
}

async function jfetch(url, opts, ms) {
  const ctl = new AbortController();
  const to = setTimeout(() => ctl.abort(), ms || 90000);
  try {
    const r = await fetch(url, Object.assign({ signal: ctl.signal }, opts || {}));
    const txt = await r.text();
    let j = null;
    try { j = JSON.parse(txt); } catch (e) { j = null; }
    if (!r.ok) {
      let msg = txt.slice(0, 200);
      if (j && j.error) { msg = typeof j.error === "string" ? j.error : (j.error.message || JSON.stringify(j.error).slice(0, 200)); }
      throw new Error("HTTP " + r.status + ": " + msg);
    }
    if (!j) { throw new Error("Risposta non valida dal servizio"); }
    return j;
  } catch (e) {
    if (e.name === "AbortError") { throw new Error("Tempo scaduto"); }
    if (e instanceof TypeError) { throw new Error("Connessione bloccata dal browser (CORS) o assente"); }
    throw e;
  } finally { clearTimeout(to); }
}

function parseJSONText(text) {
  const tx = String(text).replace(/<think>[\s\S]*?<\/think>/g, "");
  const a = tx.indexOf("{"); const b = tx.lastIndexOf("}");
  if (a < 0 || b < a) { throw new Error("Nella risposta non c'è nessun JSON"); }
  try { return JSON.parse(tx.slice(a, b + 1)); } catch (e) { throw new Error("La risposta non è un JSON valido"); }
}
function findInList(list, name) {
  const n = norm(name); if (!n) { return null; }
  let m = list.filter((p) => norm(p.n) === n);
  if (m.length === 1) { return m[0]; }
  m = list.filter((p) => norm(p.n).indexOf(n) === 0 || n.indexOf(norm(p.n)) === 0);
  return m.length === 1 ? m[0] : null;
}
const findIn = (team, name) => findInList(poolOf(team), name);
function findAnywhere(name) {
  let p = findInList(DATA[ME] || [], name);
  for (let i = 0; i < TEAMS.length && !p; i++) { p = findInList(DATA[TEAMS[i]], name); }
  return p || findInList(FREE, name);
}

function validateAI(o) {
  const w = []; const xi = { P: [], D: [], C: [], A: [] }; const tt = o.titolari || {};
  Object.keys(xi).forEach((r) => (Array.isArray(tt[r]) ? tt[r] : []).forEach((nm) => {

    if (!p) { w.push("Titolare non trovato in rosa: " + nm); return; }
    if (p.r !== r) { w.push(p.n + " è " + ROLE_ONE[p.r].toLowerCase() + ", non " + ROLE_ONE[r].toLowerCase() + ": spostato nel ruolo giusto"); }
    if (rank(ME, p.n) === 2) { w.push(p.n + " è assente: tolto dai titolari"); return; }
    if (xi[p.r].indexOf(p.n) < 0) { xi[p.r].push(p.n); }
  }));
  const total = xi.P.length + xi.D.length + xi.C.length + xi.A.length;
  if (total !== 11) { w.push("I titolari validi sono " + total + " invece di 11"); }
  const derived = xi.D.length + "-" + xi.C.length + "-" + xi.A.length;
  const modulo = MODULES.indexOf(o.modulo) >= 0 ? o.modulo : (MODULES.indexOf(derived) >= 0 ? derived : null);
  const bench = [];
  (Array.isArray(o.panchina) ? o.panchina : []).forEach((nm) => { const p = findIn(ME, nm); if (p && bench.indexOf(p.n) < 0) { bench.push(p.n); } });
  const sc = [];
  (Array.isArray(o.scambi) ? o.scambi : []).slice(0, 6).forEach((s) => {
    const give = findIn(ME, s.offri);
    const hint = TEAMS.filter((t) => t !== ME && norm(t) === norm(s.squadra));
    const teams = hint.length ? hint : TEAMS.filter((t) => t !== ME);
    let getT = null; let getP = null;
    for (let i = 0; i < teams.length && !getP; i++) { const p = findIn(teams[i], s.chiedi); if (p) { getT = teams[i]; getP = p; } }
    const why = [];
    if (!give) { why.push("giocatore offerto non trovato nella tua rosa (" + s.offri + ")"); }
    if (!getP) { why.push("giocatore richiesto non trovato (" + s.chiedi + ")"); }
    if (give && getP && give.r !== getP.r) { why.push("ruoli diversi: " + give.n + " e " + getP.n); }
    sc.push({ role: give ? give.r : null, give: give ? give.n : String(s.offri), get: getP ? getP.n : String(s.chiedi),
      team: getT || String(s.squadra || ""), why: String(s.motivo || ""), valid: why.length === 0 });
    if (why.length) { w.push("Scambio scartato: " + why.join("; ")); }
  });
  const sv = [];
  (Array.isArray(o.svincolati) ? o.svincolati : []).slice(0, 5).forEach((s) => {
    const take = findInList(FREE, s.prendi); const leave = findIn(ME, s.lascia); const why = [];
    if (!take) { why.push("svincolato non trovato (" + s.prendi + ")"); }
    if (!leave) { why.push("giocatore da lasciare non trovato (" + s.lascia + ")"); }
    if (take && leave && take.r !== leave.r) { why.push("ruoli diversi: " + take.n + " e " + leave.n); }
    sv.push({ role: leave ? leave.r : null, take: take ? take.n : String(s.prendi), leave: leave ? leave.n : String(s.lascia), why: String(s.motivo || ""), valid: why.length === 0 });
    if (why.length) { w.push("Svincolato scartato: " + why.join("; ")); }
  });
  return { modulo: modulo, xi: xi, bench: bench, scambi: sc, svinc: sv, note: String(o.note || ""), warnings: w };
}

  const mods = Object.keys(mv).sort((a, b) => mv[b] - mv[a]);
  const mod = mods[0] || "3-4-3"; const need = modNeed(mod); const votes = {};
  ids.forEach((id) => { const x = store.results[id].data.xi; Object.keys(x).forEach((r) => x[r].forEach((n) => { votes[n] = (votes[n] || 0) + 1; })); });
  const xi = {};
  Object.keys(need).forEach((r) => {
    xi[r] = (DATA[ME] || []).filter((p) => p.r === r && rank(ME, p.n) < 2)
      .sort((a, b) => (votes[b.n] || 0) - (votes[a.n] || 0) || rank(ME, a.n) - rank(ME, b.n) || b.c - a.c).slice(0, need[r]);
  });
  const bv = {}; ids.forEach((id) => store.results[id].data.bench.forEach((n) => { bv[n] = (bv[n] || 0) + 1; }));
  const inXi = {}; Object.keys(xi).forEach((r) => xi[r].forEach((p) => { inXi[p.n] = true; }));
  const bench = (DATA[ME] || []).filter((p) => !inXi[p.n] && rank(ME, p.n) < 2)
    .sort((a, b) => (bv[b.n] || 0) - (bv[a.n] || 0) || (votes[b.n] || 0) - (votes[a.n] || 0) || b.c - a.c).slice(0, 7);
  return { mod: mod, modVotes: mv[mod] || 0, xi: xi, bench: bench, votes: votes, n: ids.length, note: "", warnings: [] };

function aggOf(key, role, pick) {
  const m = {};
  okIds().forEach((id) => (store.results[id].data[key] || []).forEach((s) => {
    if (!s.valid || s.role !== role) { return; }
    const k = pick(s).k;
    if (!m[k]) { m[k] = Object.assign({ by: [], why: [] }, pick(s).o); }
    m[k].by.push(pname(id));
    if (s.why) { m[k].why.push(pname(id) + ": " + s.why); }
  }));
  return Object.keys(m).map((k) => m[k]).sort((a, b) => b.by.length - a.by.length);
}

  o.msg = "Salvo..."; renderOnb();
  try {
    if (o.teams) { store.results = {}; store.dossier = null; store.status = {}; save(); applyLocalData(); }
    await writeProfile(teams, free, me, league);
  } catch (e) {
    o.msg = e && e.code === "permission-denied" ? "Il database rifiuta il salvataggio: controlla le regole di Firestore." : "Salvataggio non riuscito: " + (e.message || e);
    renderOnb(); return;
  }
  enterApp(); go("home");
}

/* ----- azioni ----- */
async function logout() {
  try { await auth.signOut(); } catch (e) { /* già fuori */ }
}
async function delAcct() {
  if (!state.delAsk) { state.delAsk = true; renderProfilo(); return; }
  state.delAsk = false; state.busy = true; renderProfilo();
  const uid = USER.uid;
  try { await db.collection("users").doc(uid).delete(); } catch (e) { state.busy = false; state.msg = "Cancellazione dei dati non riuscita: " + (e.message || e); renderAll(); return; }
  lsDelAll(); IMGS = {}; await idbPut(uid, {});
  try { await USER.delete(); AUTH.msg = "Account e dati cancellati."; AUTH.ok = true; }
  catch (e) {
    state.busy = false;
    state.msg = e.code === "auth/requires-recent-login" ? "I tuoi dati sono stati cancellati. Per cancellare anche l'account esci, rientra e tocca di nuovo il pulsante." : authMsg(e);
    PROFILE = null; DATA = {}; TEAMS = []; FREE = []; ME = "";
    startOnb(); ONB.msg = state.msg; renderOnb(); return;
  }
  state.busy = false;
}
function act(a) {
  if (state.busy && a !== "logout") { return; }
  if (a === "save") { readKeys(); save(); log("Chiavi salvate"); return; }
  if (a === "dossier") { readKeys(); save(); withBusy(buildDossier); return; }
  if (a === "advice") {
    readKeys(); save();
    const ids = Object.keys(PROV).filter((id) => store.keys[id]);
    if (!ids.length) { log("Inserisci almeno una chiave"); return; }
    withBusy(() => runAdvice(ids)); return;
  }
  if (a === "copy") { copyPrompt(); return; }
  if (a === "addman") {
    const tx = $("man-text") ? $("man-text").value : state.manText;
    const kind = $("man-kind") ? $("man-kind").value : state.manKind;
    try {
      const data = validateAI(parseJSONText(tx));
      store.results["man:" + kind] = { ok: true, at: Date.now(), data: data };
      state.manText = ""; save(); log(MAN[kind] + ": risposta aggiunta"); renderAll();
    } catch (e) { log("Risposta non valida: " + e.message); }
    return;
  }
  if (a === "clear") { store.results = {}; store.dossier = null; store.status = {}; store.cal = null; applyLocalData(); save(); log("Risultati cancellati"); renderAll(); return; }
  if (a === "imgclear") { IMGS = {}; saveImgs(); state.msg = "Immagini rimosse."; renderAll(); return; }
  if (a === "logout") { logout(); return; }
  if (a === "retry") { afterLogin(); return; }
  if (a === "forgot") { forgot(); return; }
  if (a === "setme") {
    const v = $("p-me") ? $("p-me").value : ME;
    state.busy = true; renderProfilo();
    writeProfile(DATA, FREE, v, LEAGUE).then(() => { state.busy = false; state.msg = "Squadra cambiata."; renderAll(); },
      (e) => { state.busy = false; state.msg = "Non riesco a salvare: " + (e.message || e); renderAll(); });
    return;
  }
  if (a === "reloadrose") { state.msg = ""; startOnb({ step: 1, only: "rose", league: LEAGUE }); return; }
  if (a === "reloadfree") { state.msg = ""; startOnb({ step: 3, only: "free" }); return; }
  if (a === "wipelocal") { lsDelAll(); IMGS = {}; idbPut(USER.uid, {}); loadLocal(); state.log = []; state.msg = "Dati di questo dispositivo cancellati."; renderAll(); return; }
  if (a === "delacct") { delAcct(); return; }
  if (a === "onb-cancel") { enterApp(); return; }
  if (a === "onb-next") { if (ONB.teams) { ONB.step = 2; ONB.msg = ""; renderOnb(); } return; }
  if (a === "onb-team") {
    const me = $("onb-me").value; const lg = $("onb-league").value;
    if (!me) { ONB.msg = "Scegli la squadra che alleni."; renderOnb(); return; }
    ONB.me = me; ONB.league = lg;
    if (ONB.only === "rose") { finishOnb(true); } else { ONB.step = 3; ONB.msg = ""; renderOnb(); }
    return;
  }
  if (a === "onb-parse") {
    const tx = $("free-text").value; ONB.text = tx;
    const list = parseFreeText(tx);
    ONB.free = list.length ? list : null;
    ONB.msg = list.length ? "" : "Non ho riconosciuto nessun giocatore: serve almeno il ruolo (P, D, C o A) e il nome su ogni riga.";
    renderOnb(); return;
  }
  if (a === "onb-finish") { finishOnb(false); return; }
  if (a === "onb-skip") { ONB.free = null; finishOnb(true); return; }
}

/* ----- eventi ----- */
document.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) { return; }
  const d = b.dataset;
  if (d.go) { go(d.go); return; }
  if (d.am) { AUTH.mode = d.am; AUTH.msg = ""; const em = $("a-email"); if (em) { AUTH.email = em.value; } renderAuth(); return; }
  if (d.mod) { state.mod = d.mod; renderFormazione(); return; }
  if (d.tr) { state.tradeRole = d.tr; renderScambi(); return; }
  if (d.fs) { state.fsrc = d.fs; renderFormazione(); return; }
  if (d.lv) { state.legaView = d.lv; renderLega(); return; }
  if (d.inft) { state.infTeam = d.inft; renderLega(); return; }
  if (d.infk) { state.infKind = d.infk; renderLega(); return; }
  if (d.rt) { state.roseTeam = d.rt; renderRose(); return; }
  if (d.rr) { state.roseRole = d.rr; renderRose(); return; }
  if (d.act) { act(d.act); return; }
});
document.addEventListener("submit", (e) => { e.preventDefault(); if (e.target.id === "authform") { doAuth(); } });
document.addEventListener("input", (e) => {
  const id = e.target.id;
  if (id === "man-text") { state.manText = e.target.value; }
  if (id === "onb-league" && ONB) { ONB.league = e.target.value; }
  if (id === "free-text" && ONB) { ONB.text = e.target.value; }
});
document.addEventListener("change", (e) => {
  const t = e.target; const id = t.id;
  if (id === "man-kind") { state.manKind = t.value; }
  if (id === "onb-me" && ONB) { ONB.me = t.value; }
  if (id === "f-rose" && t.files && t.files[0] && ONB) { const f = t.files[0]; t.value = ""; onRoseFile(f); }
  if (id === "f-free" && t.files && t.files[0] && ONB) { const f = t.files[0]; t.value = ""; onFreeFile(f); }
  if (id === "f-img" && t.files && t.files.length) { const fs = Array.from(t.files); t.value = ""; addImages(fs); }
});
window.addEventListener("hashchange", () => { if (document.body.dataset.mode === "app") { route(); } });

function init() {
  buildNav(); setMode("screen"); renderHero();
  screen('<div class="card"><h3>Carico...</h3></div>');
  try { initFirebase(); } catch (e) { showError(e.message); return; }
  auth.onAuthStateChanged((u) => {
    if (!u) {
      USER = null; PROFILE = null; DATA = {}; TEAMS = []; FREE = []; ME = ""; IMGS = {}; ONB = null;
      state.log = []; state.msg = ""; state.delAsk = false; state.busy = false; AUTH.busy = false;
      store.keys = {}; store.models = {}; store.dossier = null; store.results = {}; store.status = {}; store.cal = null; applyLocalData();
      renderAuth(); return;
    }
    USER = u; afterLogin();
  });
}
init();

</script>
</body>
</html>
